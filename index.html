    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .menu-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #003366;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            text-decoration: none;
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 1.1em;
        }
        .btn:hover {
            background-color: #00509d;
            transform: translateY(-3px);
        }
        .btn-pulcini { border-left: 8px solid #008cba; } /* Colore Man City */
        .btn-primi-calci { border-left: 8px solid #ff0000; } /* Colore Liverpool/Bayern */
        .btn-piccoli-amici { border-left: 8px solid #228b22; } /* Colore Arsenal/PSG */
        
        .footer-logo {
            margin-top: 30px;
            font-size: 0.9em;
            color: #aaa;
            font-weight: bold;
        }
    </style>
