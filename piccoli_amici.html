            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 8px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }
        h1 { color: #000; font-size: 1.4em; margin-bottom: 5px; text-transform: uppercase; }
        h2 { color: #d9534f; font-size: 1.2em; margin-top: 0; }
        
        .calendar-banner {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        th {
            background-color: #003366;
            color: white;
            padding: 10px 5px;
            border: 1px solid #aaa;
            text-transform: uppercase;
        }

        td {
            border: 1px solid #ccc;
            padding: 7px 4px;
            text-align: center;
            font-weight: 700;
        }

        /* Colori Squadre specifici */
        .bayern { color: #ff0000; } /* Rosso */
        .arsenal { color: #228b22; } /* Verde */
        .barcellona { color: #0055a4; } /* Blu */

        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; }

        @media (max-width: 1000px) {
            .tables-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
