<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Piccoli Amici - Mediterraneo Village</title>
    <style>
        :root {
            --primary: #003366;
            --accent: #d9534f;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        h1 { color: #000; font-size: 1.1em; margin: 5px 0; text-transform: uppercase; }
        h2 { color: var(--accent); font-size: 0.95em; margin: 0; }
        
        .calendar-banner {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Ottimizzazione Tabella */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 12px 5px;
            text-transform: uppercase;
            font-size: 0.75em;
        }

        td {
            border-bottom: 1px solid #eee;
            padding: 10px 5px;
            text-align: center;
            font-weight: bold;
        }

        /* Colori Squadre */
        .bayern { color: #ff0000; }
        .arsenal { color: #228b22; }
        .barcellona { color: #0055a4; }

        /* --- TRASFORMAZIONE MOBILE (SCHERMO VERTICALE) --- */
        @media (max-width: 768px) {
            .tables-container {
                grid-template-columns: 1fr;
            }

            /* Nascondiamo la testata della tabella su mobile */
            thead { display: none; }

            table, tbody, tr, td {
                display: block;
                width: 100%;
            }

            tr {
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 10px;
                background: #f9f9f9;
            }

            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                padding: 5px 0;
                text-align: right;
            }

            /* Aggiungiamo le etichette per ogni dato */
            td::before {
                content: attr(data-label);
                font-weight: normal;
                color: #666;
                text-transform: uppercase;
                font-size: 0.7em;
                margin-right: 10px;
            }

            /* Evidenziamo il match principale */
            td:nth-child(1), td:nth-child(2) {
                font-size: 1.1em;
                justify-content: center;
                text-align: center;
                background: #fff;
            }
            
            td:nth-child(1)::before, td:nth-child(2)::before { content: ""; }
            
            td:nth-child(1)::after {
                content: "VS";
                display: block;
                font-size: 0.6em;
                color: #999;
                margin-top: 2px;
            }
            td:nth-child(2)::after {
                content: "";
                border-bottom: 1px solid #eee;
                width: 100%;
                display: block;
                padding-bottom: 5px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MEDITERRANEO VILLAGE</h1>
        <h2>PICCOLI AMICI 2019/2020/2021</h2>
    </header>

    <div class="calendar-banner">CALENDARIO GARE</div>

    <div class="tables-container">
        <table id="tableLeft">
            <thead>
                <tr>
                    <th>HOME</th><th>AWAY</th><th>DATA</th><th>GIORNO</th><th>ORA</th><th>RIS.</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <table id="tableRight">
            <thead>
                <tr>
                    <th>HOME</th><th>AWAY</th><th>DATA</th><th>GIORNO</th><th>ORA</th><th>RIS.</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const teamClasses = {
        "BAYERN MONACO": "bayern",
        "ARSENAL": "arsenal",
        "BARCELLONA": "barcellona"
    };

    const matchesLeft = [
        {h: "BAYERN MONACO", a: "ARSENAL", d: "11/05", g: "LUNEDI'", t: "16:30"},
        {h: "ARSENAL", a: "BARCELLONA", d: "11/05", g: "LUNEDI'", t: "16:37"},
        {h: "BAYERN MONACO", a: "BARCELLONA", d: "11/05", g: "LUNEDI'", t: "16:44"},
        {h: "BAYERN MONACO", a: "ARSENAL", d: "13/05", g: "MERCOLEDI'", t: "16:30"},
        {h: "ARSENAL", a: "BARCELLONA", d: "13/05", g: "MERCOLEDI'", t: "16:37"},
        {h: "BAYERN MONACO", a: "BARCELLONA", d: "13/05", g: "MERCOLEDI'", t: "16:44"}
    ];

    const matchesRight = [
        {h: "BAYERN MONACO", a: "ARSENAL", d: "20/05", g: "MERCOLEDI'", t: "16:30"},
        {h: "ARSENAL", a: "BARCELLONA", d: "20/05", g: "MERCOLEDI'", t: "16:37"},
        {h: "BAYERN MONACO", a: "BARCELLONA", d: "20/05", g: "MERCOLEDI'", t: "16:44"},
        {h: "BAYERN MONACO", a: "ARSENAL", d: "22/05", g: "VENERDI'", t: "16:30"},
        {h: "ARSENAL", a: "BARCELLONA", d: "22/05", g: "VENERDI'", t: "16:37"},
        {h: "BAYERN MONACO", a: "BARCELLONA", d: "22/05", g: "VENERDI'", t: "16:44"}
    ];

    function fillTable(data, tableId) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        data.forEach(m => {
            const row = `<tr>
                <td data-label="In Casa" class="${teamClasses[m.h]}">${m.h}</td>
                <td data-label="Fuori Casa" class="${teamClasses[m.a]}">${m.a}</td>
                <td data-label="Data">${m.d}/2026</td>
                <td data-label="Giorno">${m.g}</td>
                <td data-label="Orario">${m.t}</td>
                <td data-label="Risultato">-</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    fillTable(matchesLeft, "tableLeft");
    fillTable(matchesRight, "tableRight");
</script>

</body>
</html>
