<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Piccoli Amici - Mediterraneo Village</title>
    <style>
        :root {
            --primary: #003366;
            --accent: #d9534f;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        h1 { color: #000; font-size: 1.2em; margin: 5px 0; text-transform: uppercase; }
        h2 { color: var(--accent); font-size: 1em; margin: 0; }
        
        .calendar-banner {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        th {
            background-color: var(--primary);
            color: white;
            padding: 10px 5px;
            text-transform: uppercase;
            font-size: 0.8em;
        }

        td {
            border-bottom: 1px solid #eee;
            padding: 8px 5px;
            text-align: center;
            font-weight: 700;
        }

        .bayern { color: #ff0000; }
        .arsenal { color: #228b22; }
        .barcellona { color: #0055a4; }

        /* --- STILE MOBILE VERTICALE --- */
        @media (max-width: 900px) {
            .tables-container { grid-template-columns: 1fr; }
            
            thead { display: none; } /* Nasconde testata tabella */
            
            table, tbody, tr, td { display: block; width: 100%; }
            
            tr {
                margin-bottom: 20px;
                border: 2px solid #ddd;
                border-radius: 10px;
                padding: 10px;
                background: #f9f9f9;
                box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            }

            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                padding: 6px 0;
                text-align: right;
            }

            td::before {
                content: attr(data-label);
                font-weight: normal;
                color: #666;
                text-transform: uppercase;
                font-size: 0.7em;
            }

            /* Evidenzia il Match */
            td:nth-child(1), td:nth-child(2) {
                justify-content: center;
                font-size: 1.2em;
                background: #fff;
                margin: 2px 0;
            }
            td:nth-child(1)::before, td:nth-child(2)::before { content: ""; }
            td:nth-child(1)::after { content: "VS"; font-size: 0.5em; margin-left: 10px; color: #999; }
        }
    </style>
</head>
