<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Piccoli Amici - Mediterraneo Village</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px; /* Ridotto per mobile */
            color: #333;
        }
        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 15px; /* Ridotto per mobile */
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 8px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }
        h1 { color: #000; font-size: 1.2em; margin-bottom: 5px; text-transform: uppercase; }
        h2 { color: #d9534f; font-size: 1em; margin-top: 0; }
        
        .calendar-banner {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 1em;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* --- FIX PER IL MOBILE --- */
        .table-wrapper {
            width: 100%;
            overflow-x: auto; /* Permette lo scorrimento laterale */
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
            min-width: 600px; /* Impedisce alle colonne di schiacciarsi troppo */
        }

        th {
            background-color: #003366;
            color: white;
            padding: 8px 4px;
            border: 1px solid #aaa;
            text-transform: uppercase;
        }

        td {
            border: 1px solid #ccc;
            padding: 6px 4px;
            text-align: center;
            font-weight: 700;
        }

        .bayern { color: #ff0000; }
        .arsenal { color: #228b22; }
        .barcellona { color: #0055a4; }

        tr:nth-child(even) { background-color: #f2f2f2; }

        /* Responsive Breakpoints */
        @media (max-width: 1000px) {
            .tables-container { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1em; }
            h2 { font-size: 0.9em; }
            .container { padding: 10px; }
        }
    </style>
</head>
